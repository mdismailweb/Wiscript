    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-dark: #0a0e27;
            --bg-card: rgba(17, 25, 40, 0.75);
            --accent-purple: #a78bfa;
            --accent-blue: #60a5fa;
            --accent-pink: #f472b6;
            --text-primary: #e2e8f0;
            --text-secondary: #94a3b8;
            --gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* Animated background gradient */
        body::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 30% 50%, rgba(103, 126, 234, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 70% 50%, rgba(118, 75, 162, 0.15) 0%, transparent 50%);
            animation: gradientShift 15s ease infinite;
            z-index: -1;
        }

        @keyframes gradientShift {

            0%,
            100% {
                transform: translate(0, 0) rotate(0deg);
            }

            33% {
                transform: translate(5%, -5%) rotate(120deg);
            }

            66% {
                transform: translate(-5%, 5%) rotate(240deg);
            }
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            position: relative;
            z-index: 1;
        }

        /* Header */
        header {
            text-align: center;
            padding: 40px 0 30px;
            animation: fadeInDown 0.8s ease;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 800;
            background: var(--gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
            letter-spacing: -0.02em;
        }

        .tagline {
            color: var(--text-secondary);
            font-size: 0.95rem;
            font-weight: 500;
        }

        /* Search section */
        .search-section {
            margin: 30px 0;
            animation: fadeInUp 0.8s ease 0.2s both;
        }

        .search-container {
            position: relative;
            margin-bottom: 20px;
        }

        .search-input {
            width: 100%;
            padding: 16px 50px 16px 20px;
            background: var(--bg-card);
            border: 2px solid rgba(167, 139, 250, 0.2);
            border-radius: 16px;
            color: var(--text-primary);
            font-size: 1rem;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .search-input:focus {
            outline: none;
            border-color: var(--accent-purple);
            box-shadow: 0 0 20px rgba(167, 139, 250, 0.3);
        }

        .search-input::placeholder {
            color: var(--text-secondary);
        }

        .search-icon {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
            pointer-events: none;
        }

        /* Refresh button */
        .refresh-btn {
            width: 100%;
            padding: 16px;
            background: var(--gradient);
            border: none;
            border-radius: 16px;
            color: white;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: var(--shadow);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .refresh-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 25px 70px rgba(103, 126, 234, 0.4);
        }

        .refresh-btn:active {
            transform: translateY(0);
        }

        .refresh-icon {
            display: inline-block;
            transition: transform 0.5s ease;
        }

        .refresh-btn:hover .refresh-icon {
            transform: rotate(180deg);
        }

        /* WiScript cards */
        .wiscript-container {
            display: grid;
            gap: 20px;
            margin-top: 30px;
            animation: fadeInUp 0.8s ease 0.4s both;
        }

        .wiscript-card {
            background: var(--bg-card);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(167, 139, 250, 0.15);
            border-radius: 20px;
            padding: 28px;
            box-shadow: var(--shadow);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            animation: fadeInCard 0.5s ease both;
        }

        .wiscript-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: var(--gradient);
            transform: scaleX(0);
            transition: transform 0.3s ease;
        }

        .wiscript-card:hover {
            transform: translateY(-5px);
            border-color: rgba(167, 139, 250, 0.3);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6);
        }

        .wiscript-card:hover::before {
            transform: scaleX(1);
        }

        .wiscript-text {
            font-size: 1.1rem;
            line-height: 1.7;
            color: var(--text-primary);
            margin-bottom: 0;
            font-weight: 400;
        }

        .wiscript-quote {
            display: block;
            font-style: italic;
            opacity: 0.9;
        }

        /* Empty state */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
            animation: fadeIn 0.5s ease;
        }

        .empty-state-icon {
            font-size: 4rem;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        .empty-state-text {
            font-size: 1.1rem;
        }

        /* Loading spinner */
        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* Animations */
        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInCard {
            from {
                opacity: 0;
                transform: scale(0.9);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        /* Responsive */
        @media (max-width: 640px) {
            .container {
                padding: 15px;
            }

            h1 {
                font-size: 2rem;
            }

            .wiscript-card {
                padding: 24px;
            }

            .wiscript-text {
                font-size: 1rem;
            }
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 10px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-dark);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--accent-purple);
            border-radius: 5px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--accent-blue);
        }

        /* Star button */
        .star-btn {
            background: none;
            border: none;
            color: var(--accent-purple);
            font-size: 1.5rem;
            cursor: pointer;
            margin-left: 8px;
            transition: transform 0.2s;
        }

        .star-btn:hover {
            transform: scale(1.2);
        }

        .star-btn.saved {
            color: var(--accent-blue);
        }

        /* Header buttons */
        .header-btn {
            background: var(--bg-card);
            border: 1px solid rgba(167, 139, 250, 0.2);
            border-radius: 12px;
            color: var(--text-primary);
            padding: 6px 12px;
            margin-left: 8px;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .header-btn:hover {
            transform: translateY(-2px);
        }

        /* Saved flashcard */
        .saved-card {
            perspective: 1000px;
        }

        .saved-card-inner {
            position: relative;
            width: 100%;
            transform-style: preserve-3d;
            transition: transform 0.6s;
        }

        .saved-card.flipped .saved-card-inner {
            transform: rotateY(180deg);
        }

        .saved-card-front,
        .saved-card-back {
            position: absolute;
            width: 100%;
            backface-visibility: hidden;
            padding: 1rem;
            border-radius: 12px;
            background: var(--bg-card);
            box-shadow: var(--shadow);
        }

        .saved-card-back {
            transform: rotateY(180deg);
        }

        .hidden {
            display: none;
        }

        /* Utility */
        .hidden {
            display: none !important;
        }

        /* Saved Card (Flashcard) */
        .saved-card {
            background-color: transparent;
            perspective: 1000px;
            height: 300px;
            cursor: pointer;
        }

        .saved-card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.6s;
            transform-style: preserve-3d;
        }

        .saved-card.flipped .saved-card-inner {
            transform: rotateY(180deg);
        }

        .saved-card-front,
        .saved-card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            border-radius: 20px;
            padding: 20px;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            align-items: center;
            /* Use overflow-y to allow scrolling for long texts */
            overflow-y: auto;
            /* Remove justify-content: center to avoid clipping top of long content */
        }

        /* Center content vertically if it fits, otherwise let it scroll */
        .saved-card-front>*,
        .saved-card-back>* {
            margin-top: auto;
            margin-bottom: auto;
            width: 100%;
            /* Ensure text uses full width */
        }

        .saved-card-front {
            background: var(--bg-card);
            border: 1px solid rgba(167, 139, 250, 0.15);
        }

        .saved-card-back {
            background: var(--gradient);
            color: white;
            transform: rotateY(180deg);
            font-weight: bold;
            font-size: 1.2rem;
        }
    </style>
</head>

<body>
    <div class="container">
        <header>
            <h1>WiScript</h1>
            <p class="tagline">Timeless wisdom, one insight at a time</p>
            <!-- New navigation buttons -->
            <button id="savedTabBtn" class="header-btn">Saved</button>
            <button id="backupBtn" class="header-btn">Backup</button>
            <button id="restoreBtn" class="header-btn">Restore</button>
            <input type="file" id="restoreFile" accept="application/json" style="display:none;" />
        </header>

        <div class="search-section">
            <div class="search-container">
                <input type="text" class="search-input" id="searchInput"
                    placeholder="Search for wisdom by topic or keyword..." autocomplete="off">
                <span class="search-icon">🔍</span>
            </div>

            <button class="refresh-btn" id="refreshBtn">
                <span class="refresh-icon">↻</span>
                <span>Get Random WiScript</span>
            </button>
        </div>

        <div class="wiscript-container" id="wiscriptContainer">

        </div>
        <!-- Saved quotes container (hidden by default) -->
        <div class="wiscript-container hidden" id="savedContainer"></div>
    </div>

    <script>
        // Embedded wisdom data from Robert Greene tweets
        const wiscripts = [
            "Become who you are by learning who you are.",
            "Never whine, never complain, never try to justify yourself.",
            "Never be distracted by people’s glamorous portraits of themselves and their lives; search and dig for what really imprisons them.",
            "An emotional response to a situation is the single greatest barrier to power, a mistake that will cost you a lot more than any temporary satisfaction you might gain by expressing your feelings.",
            "To succeed in the game of power, you have to master your emotions. But even if you succeed in gaining such self-control, you can never control the temperamental dispositions of those around you. And this presents a great danger.",
            "In the future, the great division will be between those who have trained themselves to handle these complexities and those who are overwhelmed by them -- those who can acquire skills and discipline their minds and those who are irrevocably distracted by all the media around them and can never focus enough to learn.",
            "People are more complicated than the masks they wear in society.",
            "The time that leads to mastery is dependent on the intensity of our focus.",
            "People around you, constantly under the pull of their emotions, change their ideas by the day or by the hour, depending on their mood. You must never assume that what people say or do in a particular moment is a statement of their permanent desires.",
            "No one is really going to help you or give you direction. In fact, the odds are against you.",
            "When our emotions are engaged, we often have trouble seeing things as they are.",
            "The future belongs to those who learn more skills and combine them in creative ways.",
            "Whenever you can, bury the hatchet with an enemy, and make a point of putting him in your service.",
            "Make your masters appear more brilliant than they are and you will attain the heights of power.",
            "The great questions of the time will be decided, not by speeches and resolutions of majorities, but by iron and blood.",
            "Power has its own rhythms and patterns. Those who succeed at the game are the ones who control the patterns and vary them at will, keeping people off balance while they set the tempo. The essence of strategy is controlling what comes next, and the elation of victory can upset your ability to control what comes next in two ways. First, you owe your success to a pattern that you are apt to try to repeat.... Second, success tends to go to your head ... The powerful vary their rhythms and patterns, change course, adapt to circumstance, and learn to improvise.",
            "Excuses satisfy no one and apologies make everyone uncomfortable.",
            "Always make those above you feel comfortably superior.",
            "The next time someone pushes you and you find yourself starting to react, try this: Do not resist or fight back, but yield.",
            "When you are trying to impress people with words, the more you say, the more common you appear, and the less in control. Even if you are saying something banal, it will seem original if you make it vague, open-ended, and sphinxlike. Powerful people impress and intimidate by saying less. The more you say, the more likely you are to say something foolish.",
            "Remember the following: Never take your position for granted and never let any favors you receive go to your head.",
            "Periodically change up routines, surprise the group with something new or challenging. This will wake them up and stir them out of the complacency that can settle into any group that achieves success.",
            "We think we are judging the younger generation in an objective manner, but we are merely succumbing to an illusion of perspective. It is also true that we are probably experiencing some hidden envy of their youth and mourning the loss of our own.",
            "In knowing yourself, you accept your limits. You are simply one person among many in the world, and not naturally superior to anyone.",
            "Emotions are continually affecting our thought processes and decisions, below the level of our awareness. And the most common emotion of them all is the desire for pleasure and the avoidance of pain.",
            "Create the proper first impression. It has been demonstrated how much people tend to judge based on first impressions and the difficulties they have in reassessing these judgments.",
            "To imagine that we are not always in control of what we do is a frightening thought, but in fact it is the reality. We are subject to forces from deep within us that drive our behavior and that operate below the level of our awareness.",
            "We are all narcissists, some deeper on the spectrum than others. Our mission in life is to come to terms with this self-love and learn how to turn our sensitivity outward, toward others, instead of inward.",
            "In a world full of endless distractions, you must focus and prioritize.",
            "This feeling of being lost and confused is not anyone’s fault. It is a natural reaction to having been born into times of great change and chaos. The old support systems of the past—religions, universal causes to believe in, social cohesion—have mostly disappeared, at least in the Western world. Disappearing also are the elaborate conventions, rules, and taboos that once channeled behavior. We are all cast adrift, and it is no wonder that so many people lose themselves in addictions and depression.",
            "False purposes lead downward, to the animal side of our nature—to addictions, loss of mental powers, mindless conformity, and cynicism.",
            "Love, friendship, respect do not unite people as much as common hatred for something.",
            "The true spirit of conversation consists more in bringing out the cleverness of others than in showing a great deal of it yourself; he who goes away pleased with himself and his own wit is also greatly pleased with you.",
            "Demagogues in politics or the media try to stir a continual sense of panic, urgency, and outrage. They must keep the emotional levels high. Your defense is simple: Consider your reasoning powers, your ability to think for yourself, your most precious possession. Resent any kind of intrusion upon your independent mind by others. When you feel you are in the presence of a demagogue, become doubly wary and analytical.",
            "Reading and thinking about [new ideas] won't work. You must put them into effect.",
            "Think of the mind as a river: the faster it flows, the better it keeps up with the present and responds to change. The faster it flows, also the more it refreshes itself and the greater its energy. Obsessional thoughts, past experiences (whether traumas or successes), and preconceived notions are like boulders or mud in this river, settling and hardening there and damming it up. The river stops moving; stagnation sets in. You must wage constant war on this tendency in the mind.",
            "Dreaming first of what you want and then trying to find the means to reach it is a recipe for exhaustion, waste, and defeat.",
            "Do not find yourself constantly retreating, reacting to your enemies’ maneuvers. Arm yourself with prudence, and never completely lay down your arms, not even for friends.",
            "If you have never been willing to fight back before, no threatening gesture you make will be credible.",
            "What you know must translate into action, and action must translate into knowledge. In this way, strategy becomes a lifelong challenge and the source of constant pleasure in surmounting difficulties and solving problems.",
            "Instead of internalizing a bad situation, externalize it and face your enemy. It is the only way out.",
            "Being attacked is a sign that you are important enough to be a target.",
            "The world is ruled by necessity: People change their behavior only if they have to. They will feel urgency only if their lives depend on it.",
            "It’s not what you have that brings you victory, it’s how you use it. When you have less, you are naturally more inventive.",
            "The leader who tries to change the group’s spirit directly—yelling, demanding, disciplining—actually plays into the teenage dynamic and reinforces the desire to rebel.",
            "Your enemies, those you stand sharply against, will help you to forge a support base that will not desert you. Do not crowd into the center, where everyone else is; there is no room to fight in a crowd. Polarize people, drive some of them away, and create a space for battle.",
            "The more we lose ourselves in predigested theories and past experiences, the more inappropriate and delusional our response.",
            "In life you must be a warrior, and war requires realism. While others may find beauty in endless dreams, warriors find it in reality, in awareness of limits, in making the most of what they have.",
            "If you feel lost and confused, if you lose your sense of direction, if you cannot tell the difference between friend and foe, you have only yourself to blame.",
            "What’s something you’ve always felt a pull toward? Dive deep into it today.",
            "Your first task as a strategist is to widen your concept of the enemy, to include in that group those who are working against you, thwarting you, even in subtle ways.",
            "Being more careful is not what we need; that is just a screen for our fear of conflict and of making a mistake. What we need is double the resolve—an intensification of confidence. That will serve as a counterbalance.",
            "Do not be lured by the need to be liked: better to be respected, even feared. Victory over your enemies will bring you a more lasting popularity.",
            "Think back on the moments when you felt deeply and personally connected to an activity. Think about the pleasure it brought you. In such activities are signs of your true purpose.",
            "Operating with long-term goals will bring you tremendous clarity and resolve.",
            "Practical knowledge is the ultimate commodity. Evaluate opportunities using one criterion: the greatest possibility for learning.",
            "Learning how to learn is the most important skill to acquire.",
            "Reminder: Act boldly on one of your ideas today.",
            "Everything worth doing has a learning curve. When it gets hard, remember the goal: reaching the cycle of accelerated returns.",
            "It is the height of stupidity to believe that in the course of your short life, your few decades of consciousness, you can somehow rewire the configurations of your brain through technology and wishful thinking, overcoming the effect of six million years of development.",
            "Find the deepest pleasure in absorbing knowledge and information. Feel like you never have enough.",
            "Make a list of the people in your life who live with purpose. Prioritize spending more time with them.",
            "Reading books and materials that go beyond what is required is always a good starting point. Being exposed to ideas in the wide world, you will tend to develop a hunger for more and more knowledge.",
            "Try the thing you don’t think you’re quite ready for.",
            "In dealing with any problem, you must train yourself to look at how it inevitably connects to a larger picture.",
            "Do not waste time on things you cannot change or influence.",
            "To negate the ego you must adopt a kind of humility toward knowledge.",
            "Knowledge is always progressing. Don’t let your ego fool you. You are always knowledge’s inferior.",
            "Immersing yourself in details will combat the generalizing tendencies of the brain and bring you closer to reality.",
            "The more skills you learn, the richer the landscape of the brain. It’s up to you.",
            "Petulance is not power, it is a sign of helplessness. People may temporarily be cowed by your tantrums, but in the end they lose respect for you. They also realize they can easily undermine a person with so little self-control.",
            "What has worth is worth paying for. By paying your own way you stay clear of gratitude, guilt, and deceit. It is also often wise to pay the full price—there is no cutting corners with excellence.",
            "When choosing people to work and associate with, do not be mesmerized by their reputation or taken in by the surface image they try to project. Instead, train yourself to look deep within them, to their past actions, to see their character.",
            "Being self-reliant is critical. To make yourself less dependent on others and so-called experts, you need to expand your repertoire of skills.",
            "Like a builder, develop the highest standards, and the patience for the step-by-step process.",
            "In order to master a field, you must love the subject and feel a profound connection to it. Your interest must transcend the field and border on the religious.",
            "Being ourselves and just saying what we think can land us in all kinds of trouble. We come to realize that the work world is riddled with political games that nobody has prepared us for.",
            "Strive to be the only one who can do what you do and make the fate of those who hire you so entwined with yours that they cannot possibly get rid of you.",
            "Concentrate on maintaining a high sense of purpose, and the success will flow to you naturally.",
            "Feeling energized influences our mood, which influences our work in very direct ways. And feeling confused or disorganized in our work can have a terrible effect on us physically as well.",
            "What you need is a mental filtering system based on a scale of priorities and your long-term goals.",
            "No calling is superior to another. What matters is that it be tied to a personal need and inclination, and that your energy moves you toward improvement and continuous learning from experience.",
            "Embrace your strangeness. Identify what makes you different. Fuse those things together and become an anomaly.",
            "The single greatest action you can take for acquiring creative power is to reverse this natural impatience. Imagine yourself years in the future looking back at the work you have done.",
            "Always remember that your calmness under fire is your best defense in any argument or discussion.",
            "We do not see people as they are, but as they appear to us. And these appearances are usually misleading.",
            "Stop listening so much to the words and opinions of others, telling you who you are and what you should like and dislike.",
            "Operating with long-term goals will bring you tremendous clarity and resolve.",
            "Knowing in a deep way who you are, your uniqueness, will make it that much easier to avoid all of life’s other pitfalls.",
            "Everything worth doing has a learning curve. When it gets hard, remember the goal: reaching the cycle of accelerated returns.",

        const STORAGE_KEY_SAVED = 'savedQuotes';
        const STORAGE_KEY_BACKUP = 'wiscriptBackup';

        let currentWiscripts = [...wiscripts];
        let filteredWiscripts = [...wiscripts];

        // DOM Elements
        const searchInput = document.getElementById('searchInput');
        const refreshBtn = document.getElementById('refreshBtn');
        const wiscriptContainer = document.getElementById('wiscriptContainer');

        // Initialize with random wiscripts
        function init() {
            displayRandomWiscript();
        }

        // Display random wiscript
        function displayRandomWiscript() {
            const randomIndex = Math.floor(Math.random() * currentWiscripts.length);
            const randomWiscript = currentWiscripts[randomIndex];
            displayWiscripts([randomWiscript]);
        }

        // Display wiscripts
        function displayWiscripts(wiscriptsToShow) {
            wiscriptContainer.innerHTML = '';
            const savedQuotes = JSON.parse(localStorage.getItem(STORAGE_KEY_SAVED) || '[]');

            if (wiscriptsToShow.length === 0) {
                wiscriptContainer.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">🔍</div>
                        <div class="empty-state-text">No WiScripts found. Try a different search term.</div>
                    </div>
                `;
                return;
            }

            wiscriptsToShow.forEach((wiscript, index) => {
                const isSaved = savedQuotes.includes(wiscript);
                const starClass = isSaved ? 'star-btn saved' : 'star-btn';
                const starIcon = isSaved ? '★' : '☆';

                // Escape simple quotes for the onclick handler
                const safeQuote = wiscript.replace(/'/g, "\\'");

                const card = document.createElement('div');
                card.className = 'wiscript-card';
                card.style.animationDelay = `${index * 0.1}s`;
                card.innerHTML = `
                    <p class="wiscript-text">
                        <span class="wiscript-quote">"${wiscript}"</span>
                        <button class="${starClass}" onclick="toggleSaveQuote('${safeQuote}')" title="${isSaved ? 'Unsave' : 'Save'}">${starIcon}</button>
                    </p>
                `;
                wiscriptContainer.appendChild(card);
            });
        }

        // Search functionality
        function performSearch(query) {
            if (!query.trim()) {
                displayRandomWiscript();
                return;
            }

            const searchTerm = query.toLowerCase();
            filteredWiscripts = wiscripts.filter(wiscript =>
                wiscript.toLowerCase().includes(searchTerm)
            );

            displayWiscripts(filteredWiscripts);
            currentWiscripts = filteredWiscripts.length > 0 ? filteredWiscripts : wiscripts;
        }

        // Toggle Save Quote
        function toggleSaveQuote(quote) {
            let saved = JSON.parse(localStorage.getItem(STORAGE_KEY_SAVED) || '[]');
            let backup = JSON.parse(localStorage.getItem(STORAGE_KEY_BACKUP) || '[]');

            if (saved.includes(quote)) {
                saved = saved.filter(q => q !== quote);
            } else {
                saved.push(quote);
                // Also add to backup history if not present
                if (!backup.includes(quote)) {
                    backup.push(quote);
                    localStorage.setItem(STORAGE_KEY_BACKUP, JSON.stringify(backup));
                }
            }

            localStorage.setItem(STORAGE_KEY_SAVED, JSON.stringify(saved));

            // Refund/Update view
            if (document.getElementById('savedContainer').classList.contains('hidden')) {
                displayWiscripts(currentWiscripts); // Re-render main list to update stars
            } else {
                renderSavedView(); // Re-render saved view logic defined below
            }
        }

        // Render Saved View (Flashcards)
        function renderSavedView() {
            const savedContainer = document.getElementById('savedContainer');
            const saved = JSON.parse(localStorage.getItem(STORAGE_KEY_SAVED) || '[]');
            savedContainer.innerHTML = '';

            if (saved.length === 0) {
                savedContainer.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">★</div>
                        <div class="empty-state-text">No saved quotes yet. Star some quotes to see them here!</div>
                    </div>`;
                return;
            }

            saved.forEach((quote, index) => {
                const card = document.createElement('div');
                card.className = 'saved-card';
                card.onclick = function () {
                    this.classList.toggle('flipped');
                };

                card.innerHTML = `
                    <div class="saved-card-inner">
                        <div class="saved-card-front">
                            <p class="wiscript-text">"${quote}"</p>
                        </div>
                        <div class="saved-card-back">
                            <p>Wisdom Learned</p>
                        </div>
                    </div>
                `;
                savedContainer.appendChild(card);
            });
        }

        // Backup Implementation
        async function backupQuotes() {
            const backup = localStorage.getItem(STORAGE_KEY_BACKUP) || '[]';
            // If backup is empty but saved quotes exist, sync them first (migration support)
            let backupArr = JSON.parse(backup);
            if (backupArr.length === 0) {
                const saved = JSON.parse(localStorage.getItem(STORAGE_KEY_SAVED) || '[]');
                if (saved.length > 0) {
                    backupArr = [...saved];
                    localStorage.setItem(STORAGE_KEY_BACKUP, JSON.stringify(backupArr));
                }
            }

            const dataStr = JSON.stringify(backupArr, null, 2);

            // Use File System Access API if supported for overwrite capability
            if ('showSaveFilePicker' in window) {
                try {
                    const handle = await window.showSaveFilePicker({
                        suggestedName: 'wiscript_backup.json',
                        types: [{
                            description: 'JSON Files',
                            accept: { 'application/json': ['.json'] },
                        }],
                    });

                    const writable = await handle.createWritable();
                    await writable.write(dataStr);
                    await writable.close();
                    return; // Success
                } catch (err) {
                    if (err.name !== 'AbortError') {
                        console.error('File Picker Error:', err);
                        // Fallback to legacy download on error (but not abort)
                    } else {
                        return; // User cancelled
                    }
                }
            }

            // Legacy Fallback
            const blob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(blob);

            const a = document.createElement('a');
            a.href = url;
            a.download = 'wiscript_backup.json';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        // Restore Implementation
        function restoreQuotes(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function (e) {
                try {
                    const quotes = JSON.parse(e.target.result);
                    if (Array.isArray(quotes)) {
                        // Merge strategies can vary, here we overwrite 'saved' and 'backup' to restore state exactly or cumulatively.
                        // Impl plan said "Overwrite both".
                        localStorage.setItem(STORAGE_KEY_SAVED, JSON.stringify(quotes));
                        localStorage.setItem(STORAGE_KEY_BACKUP, JSON.stringify(quotes));

                        alert('Wisdom restored successfully!');

                        // Reset file input
                        event.target.value = '';

                        // Update UI
                        if (!document.getElementById('savedContainer').classList.contains('hidden')) {
                            renderSavedView();
                        } else {
                            displayWiscripts(currentWiscripts);
                        }
                    } else {
                        alert('Invalid backup file format.');
                    }
                } catch (err) {
                    console.error(err);
                    alert('Error reading backup file.');
                }
            };
            reader.readAsText(file);
        }

        // Event listeners
        searchInput.addEventListener('input', (e) => {
            performSearch(e.target.value);
        });

        refreshBtn.addEventListener('click', () => {
            searchInput.value = '';
            currentWiscripts = [...wiscripts];
            displayRandomWiscript();

            // Rotate animation
            const icon = refreshBtn.querySelector('.refresh-icon');
            icon.style.transform = 'rotate(360deg)';
            setTimeout(() => {
                icon.style.transform = 'rotate(0deg)';
            }, 500);
        });

        // New Event Listeners for Header Buttons
        document.getElementById('backupBtn').addEventListener('click', backupQuotes);

        const restoreBtn = document.getElementById('restoreBtn');
        const restoreFile = document.getElementById('restoreFile');
        restoreBtn.addEventListener('click', () => restoreFile.click());
        restoreFile.addEventListener('change', restoreQuotes);

        const savedTabBtn = document.getElementById('savedTabBtn');
        const wiscriptContainerDiv = document.getElementById('wiscriptContainer');
        const savedContainerDiv = document.getElementById('savedContainer');
        const searchSection = document.querySelector('.search-section');
        const mainTitle = document.querySelector('h1');

        savedTabBtn.addEventListener('click', () => {
            wiscriptContainerDiv.classList.add('hidden');
            searchSection.classList.add('hidden');
            savedContainerDiv.classList.remove('hidden');
            renderSavedView();
        });

        mainTitle.style.cursor = 'pointer';
        mainTitle.addEventListener('click', () => {
            savedContainerDiv.classList.add('hidden');
            wiscriptContainerDiv.classList.remove('hidden');
            searchSection.classList.remove('hidden');
            // Refresh main view to update stars if changed
            displayWiscripts(currentWiscripts);
        });

        // Initialize app
        init();

        // PWA Service Worker Registration (No-op for single file, mostly for future proofing or local servers)
        if ('serviceWorker' in navigator) {
            // We can't register a real SW without an external file or complex hack, 
            // but the Manifest is the key part for "Add to Home Screen" styling.
            // A simple registration attempt:
            window.addEventListener('load', () => {
                // This will fail on file:// protocol, which is expected.
                // It works if served via http://localhost or https://
                navigator.serviceWorker.register('sw.js').catch(err => console.log('SW registration skipped (offline/file mode)'));
            });
        }
    </script>
